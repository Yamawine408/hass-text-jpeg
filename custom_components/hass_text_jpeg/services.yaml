draw:
  name: Draw text JPEG
  description: Render a single line of text to a JPEG file in /media.
  fields:
    text:
      name: Text
      description: Text to render. Newlines are not supported.
      required: true
      example: "緊急地震速報 深度5"
      selector:
        text:
    filename:
      name: Filename
      description: Simple output filename in /media; .jpg or .jpeg.
      required: true
      example: "alert.jpg"
      selector:
        text:
    font:
      name: Font
      description: Font filename under /config/www/fonts, or an absolute font path.
      example: "NotoSansJP-Regular.ttf"
      selector:
        text:
    width:
      default: 400
      selector:
        number:
          min: 1
          max: 4096
          mode: box
    height:
      default: 240
      selector:
        number:
          min: 1
          max: 4096
          mode: box
    font_size:
      name: Font size
      default: 32
      selector:
        number:
          min: 1
          max: 512
          mode: box
    x:
      default: 10
      selector:
        number:
          mode: box
    pos_y:
      name: Y position
      description: Top of the font line box. Use pos_y because bare y can be parsed as a boolean YAML key.
      default: 10
      selector:
        number:
          mode: box
    color:
      name: Text color
      default: "#000000"
      selector:
        text:
    background:
      name: Background color
      default: "#ffffff"
      selector:
        text:
    quality:
      name: JPEG quality
      default: 95
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    spacing:
      name: Character spacing
      default: 0
      selector:
        number:
          min: 0
          max: 256
          mode: box
