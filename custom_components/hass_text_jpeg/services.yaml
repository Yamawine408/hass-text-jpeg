draw:
  name: Draw text to JPEG
  description: Render text into a JPEG image and save it under /media.
  fields:
    text:
      name: Text
      description: Text to render. Explicit line breaks are supported.
      required: true
      selector:
        text:
          multiline: true
    filename:
      name: Filename
      description: JPEG filename to create in /media. Do not include a directory.
      required: true
      selector:
        text:
    font:
      name: Font
      description: Optional font filename in /config/www/fonts, or an absolute font path. If omitted, the bundled Noto Sans CJK JP font is used.
      selector:
        text:
    width:
      name: Image width
      selector:
        number:
          min: 1
          max: 4096
          mode: box
    height:
      name: Image height
      selector:
        number:
          min: 1
          max: 4096
          mode: box
    font_size:
      name: Font size
      selector:
        number:
          min: 1
          max: 512
          mode: box
    pos_x:
      name: X position
      description: Left edge of the text layout area.
      selector:
        number:
          mode: box
    pos_y:
      name: Y position
      description: Top edge of the first text line. Text below the image is clipped.
      selector:
        number:
          mode: box
    align:
      name: Horizontal alignment
      description: Alignment of each line within the area from pos_x to the right edge.
      default: left
      selector:
        select:
          options:
            - label: Left
              value: left
            - label: Center
              value: center
            - label: Right
              value: right
    wrap:
      name: Wrap text
      description: Wrap Japanese text by character and space-separated text by word. A word wider than the area is split by character.
      default: true
      selector:
        boolean:
    color:
      name: Text color
      selector:
        text:
    background:
      name: Background color
      selector:
        text:
    quality:
      name: JPEG quality
      selector:
        number:
          min: 1
          max: 100
          mode: slider
    spacing:
      name: Character spacing
      selector:
        number:
          min: 0
          max: 256
          mode: box
